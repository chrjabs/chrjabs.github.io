[default]
extend-ignore-re = [
  # disable spellcheck for specific lines with trailing `// spellchecker:disable-line`
  "(?Rm)^.*(%|#|//)\\s*spellchecker:disable-line$",
]
ignore-hex = true

[default.extend-words]
# keep-sorted start
IHS = "IHS"
OLL = "OLL"
Ofer = "Ofer"
annote = "annote"
# keep-sorted end

[files]
extend-exclude = ["pgp.asc"]
