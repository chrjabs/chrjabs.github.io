# Site Settings
baseurl: ""

# Features Setting
# Turn subpages on or off
publications: True
presentations: True
blog: False

# Language of the website
lang: en

# Search engine optimization settings
title: Christoph Jabs
tagline: German CS student living in Helsinki
description: >
  Postdoctoral Researcher in computer science at the University of Helsinki.
  Researching constraint solving for inductive logic programming.
  Originally from Germany.
author: Christoph Jabs
logo: https://s.gravatar.com/avatar/6441cc4485943f3202aa6ff355577806?s=400
social:
  name: Christoph Jabs
  links:
    - https://mstdn.science/@chrjabs
    - https://codeberg.org/chrjabs
    - https://github.com/chrjabs
locale: en_GB

# Page Settings
theme_settings:
  title: Christoph Jabs

  experience_title: EXPERIENCE
  interests_title: RESEARCH INTERESTS
  skills_title: SKILLS
  awards_title: AWARDS
  projects_title: PROJECTS
  recentpubs_title: RECENT PUBLICATIONS

# Pagination
paginate: 5
paginate_path: "blog/page:num"

# Build Settings
sass:
  sass_dir: _sass
  style: :compressed
plugins: ['jekyll-paginate', 'jekyll/scholar', 'jekyll-seo-tag']
bootstrap:
  assets: true

# Bibliography settings
scholar:
  bibliography: publications.bib
  bibliography_template: pubstemplate
  style: apa
  locale: en
  last_name: Jabs
  first_name: [Christoph, C.]
  sort_by: year,month
  order: descending,descending
  details_layout: pubdetailstemplate.html
  details_link:

# Collection of hub pages
collections:
  hubs:
    output: true
    permalink: /:name

filtered_bibtex_keywords: [abbr, abstract, arxiv, bibtex_show, html, pdf, selected, supp, blog, code, poster, slides, website, note, eprint, eprinttype] # Filter out certain bibtex entry keywords used internally from the bib output

academicons:
  version: "1.9.5"
  integrity: "sha384-IAnhEDrYZnLsYcVzowpizdxXTHFovW5/CkZObGfY2QuaCKaQpvLCjj45LGb4Q/yE"
fontawesome:
  version: "7.3.1"
  integrity: "sha384-qrALq7+6jBOZIQsNnT6xGkMDru64qD6uTlDra39xrt2SoXl4pO3FX6Roz/RpR/BS"
jquery:
  version: "3.6.0"
  integrity: "sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
